name: Check

# Always make sure that direct pushes to main are not allowed!
on:
  # Every PR, not only those into main: in a stack, each PR targets the branch below it.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  lint-format-types:
    # Draft PRs skip CI; marking one ready for review runs it.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        env:
          SKIP_ENV_VALIDATION: "true"
        run: pnpm build

      - name: Check lint, format, and types
        run: pnpm run check
